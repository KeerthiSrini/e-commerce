name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main  # Change if using a different branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🏗️ Install AWS Elastic Beanstalk CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install awsebcli --upgrade

      - name: 🚀 Deploy to AWS Elastic Beanstalk
        env:
          EBS_APPLICATION_NAME: ${{ secrets.EBS_APPLICATION_NAME }}
          EBS_ENVIRONMENT_NAME: ${{ secrets.EBS_ENVIRONMENT_NAME }}
        run: |
          eb init "$EBS_APPLICATION_NAME" --region $AWS_REGION
          eb deploy "$EBS_ENVIRONMENT_NAME"
